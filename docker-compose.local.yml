# 내 노트북. 소스에서 직접 빌드하고, DB 포트를 호스트에 열어 둔다.
# COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      MYSQL_HOST: mysql-db
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql-db:
    image: mysql:8.4.9
    container_name: nyummy-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 개발 서버(dev)와 DB 설정을 맞춰 둔다. 메모리 상한은 로컬이라 걸지 않는다.
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: valkey/valkey:9.1-alpine
    container_name: nyummy-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: [ "redis-server", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD}" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s

volumes:
  mysql-data:
