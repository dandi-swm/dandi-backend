# 서버 고정 문구의 원본(한국어). 키를 추가하면 messages_ja·messages_en에도 같은 키를 넣는다(MessagesTest가 검사한다).
# 인자 {0}·{1}은 MessageFormat 문법이다. 인자가 있는 문구에서 작은따옴표(')는 ''로 두 번 쓴다.
# 키 이름도 CLAUDE.md 용어집을 따른다.

# 끼니 라벨 — MealTime enum 이름
mealTime.BREAKFAST=아침
mealTime.LUNCH=점심
mealTime.DINNER=저녁

# 식사 리마인더 — title {0}=끼니 라벨(mealTime.*), body {0}=고양이 이름
push.mealReminder.title=집사, {0}은 먹었어? 🐾
push.mealReminder.body={0} 너무 배고프다냥. 사진 한 장만 찍어줘!

# 리텐션 — 굶은 일수에 따라 하나를 고른다. title {0}=고양이 이름
# 14일째
push.retention.sleep.title=잠든 {0} 💤
push.retention.sleep.body=한 끼 기록하고 깨워주세요!
# 3·6·9·12일째 — body {0}=굶은 일수
push.retention.loseWeight.title={0} 홀쭉해지고 있어요 🐾
push.retention.loseWeight.body={0}일째 밥을 못 먹었어요ㅠㅠ
# 그 밖의 날
push.retention.daily.title={0} 밥 챙겨주라냥 🐾
push.retention.daily.body=오늘 하루 밥을 깜빡했다냥!

# 마이룸 아이템 분류 — RoomItemCategory enum 이름. 상점 카드와 마이룸 탭에 쓴다
roomItemCategory.BACKGROUND=배경
roomItemCategory.BED=침대
roomItemCategory.CAT_WHEEL=캣휠
roomItemCategory.RUG=러그
roomItemCategory.ETC=소품

# 상품 카드 태그 — 한정 > 할인 > 신규 순서로 하나만 붙인다
shop.tag.limited=한정
shop.tag.discounted=할인
shop.tag.new=신규

# 추천 탭 섹션 제목 줄
shop.section.dailyPromotion.title=오늘의 할인
shop.section.popular.title=지금 인기 있는 가구
shop.section.seeAll=전체보기

# 오늘의 할인 남은 시간 — 끝나기 3시간 전부터 분 단위(올림), 그 전에는 시간 단위(올림)
# 0인 단위는 쓰지 않아 경우마다 문장을 따로 둔다. {0}=시간, {1}=분
shop.dailyPromotion.remainingHoursMinutes={0}시간 {1}분 남았어요
shop.dailyPromotion.remainingHours={0}시간 남았어요
shop.dailyPromotion.remainingMinutes={0}분 남았어요
shop.dailyPromotion.changesInHours={0}시간 후 바뀌어요

# 장바구니 구매 불가 사유 — 구매할 수 없는 항목 아래에 보인다
cart.unavailableReason.productNotForSale=판매가 끝났어요
cart.unavailableReason.alreadyOwned=이미 가진 방 배경이에요
cart.unavailableReason.purchaseLimitExceeded=구매 한도를 넘었어요

# 고양이 체형 이름 — CatWeight enum 이름
catWeight.LEAN=홀쭉냥
catWeight.SLIM=날씬냥
catWeight.NORMAL=보통냥
catWeight.CHUBBY=통통냥
catWeight.PLUMP=뚱냥이

# 코인 내역 제목 — CoinHistoryCategory enum 이름. 상점 구매는 상품 이름을 알면 아래 itemPurchase 문구를 쓴다
coinHistoryCategory.MAIL_CLAIM=우편 받기
coinHistoryCategory.ROOM_ITEM_PURCHASE=상점 구매
coinHistoryCategory.IN_APP_PURCHASE=코인 구매
coinHistoryCategory.COIN_GIFT=코인 선물
coinHistoryCategory.ITEM_PURCHASE_REFUND=상점 환불
coinHistoryCategory.REPORT_PURCHASE=리포트 구매
coinHistoryCategory.REPORT_PURCHASE_REFUND=리포트 환불
# 상점 구매 — {0}=첫 상품 이름, {1}=나머지 상품 개수(같은 상품도 1개당 하나로 센다)
coinHistory.itemPurchase.single={0} 구매
coinHistory.itemPurchase.multiple={0} 외 {1}개 구매
