spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB}?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_SIZE:10}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms

  flyway:
    baseline-on-migrate: true

  jpa:
    show-sql: false

logging:
  level:
    com.dandi.nyummy: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  metrics:
    # 자원 지표(JVM·Hikari·Tomcat 등)는 prod만 본다. dev는 API 대시보드에 쓰는 메트릭만 내보낸다.
    # 키는 메트릭 이름 앞부분으로 매칭되고 더 긴 키가 이긴다. 새 메트릭을 dev에서도 보려면 여기에 추가한다.
    enable:
      all: false
      "[http.server.requests]": true
  opentelemetry:
    resource-attributes:
      "[deployment.environment.name]": dev
  tracing:
    sampling:
      # dev는 트래픽이 적으니 전부 샘플링한다.
      probability: 1.0
