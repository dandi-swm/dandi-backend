push.mealReminder.body={0}はお腹がペコペコだにゃ。写真を1枚撮ってほしいにゃ！

# リテンション — 放置日数に応じて選択。title {0}=猫の名前
# 14日目
push.retention.sleep.title=眠ってしまった{0} 💤
push.retention.sleep.body=食事を記録して起こしてあげてください！
# 3・6・9・12日目 — body {0}=放置日数
push.retention.loseWeight.title={0}がやせ細ってきています 🐾
push.retention.loseWeight.body={0}日もごはんを食べていないにゃ…
# その他の日
push.retention.daily.title={0}にごはんをちょうだいにゃ 🐾
push.retention.daily.body=今日のごはんを忘れちゃったにゃ！

