spring:
  application:
    name: nyummy
  profiles:
    default: local

  datasource:
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration/mysql

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  forward-headers-strategy: framework

app:
  meal:
    upload-method: "PUT"
    max-file-size-bytes: 10485760
    presigned-url-expiration-minutes: 10
    capture-time-tolerance: 1h
  ai:
    api-key: ${GEMINI_API_KEY}
    model: "gemini-3.6-flash"
    base-url: "https://generativelanguage.googleapis.com"
    connect-timeout: 5s
    read-timeout: 30s
  auth:
    login-redirect-url: "dandi://home"
    signup-redirect-url: "dandi://signup"
  oauth:
    kakao:
      issuer: "https://kauth.kakao.com"
      jwk-set-uri: "https://kauth.kakao.com/.well-known/jwks.json"
      app-key: ${KAKAO_NATIVE_APP_KEY}
      connect-timeout: 5s
      read-timeout: 5s
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    encryption-key: ${JWT_ENCRYPTION_KEY}
    access-time-to-live: 30m
    refresh-time-to-live: 15d
    refresh-absolute-time-to-live: 90d
    email-challenge-time-to-live: 5m
    email-verified-time-to-live: 30m
    oauth-verified-time-to-live: 30m
  argon2:
    salt-length: 16
    hash-length: 32
    parallelism: 1
    memory: 19456
    iterations: 2