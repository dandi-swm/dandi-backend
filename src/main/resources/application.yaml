spring:
  application:
    name: nyummy
  profiles:
    default: local

  datasource:
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Hibernate는 Instant를 UTC 기준 시각 문자열로 보내고, MySQL은 그 문자열을 세션 time_zone으로 해석한다.
      # 세션을 UTC로 고정해 DB 서버 시간대(local·dev 컨테이너는 KST, 운영 RDS는 UTC)와 무관하게 같은 순간으로 저장한다.
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true

  flyway:
    enabled: true
    locations: classpath:db/migration/mysql

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # app.email.client=smtp일 때 SmtpEmailClient가 쓰는 JavaMailSender 설정 (Gmail, 앱 비밀번호)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_SMTP_USERNAME}
    password: ${EMAIL_SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # 기본값은 무한 대기 — SMTP 서버가 응답하지 않으면 요청 스레드가 묶인다.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  # 어드민이 음식 아이콘·마이룸 아이템 이미지를 서버로 올린다(앱 이미지는 presigned URL로 S3에 바로 올려 해당 없음).
  # 기본 1MB로는 마이룸 아이템(최대 5MB)을 받지 못한다. 파일별 최대 크기는 서비스가 따로 검증한다.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  forward-headers-strategy: framework
  tomcat:
    # 요청 처리 스레드 지표(tomcat.threads.busy·config.max)는 MBean 등록이 켜져 있어야 나온다.
    mbeanregistry:
      enabled: true

# 관측: 메트릭·트레이스·로그를 Grafana Cloud OTLP 게이트웨이로 보낸다.
# 기본은 꺼짐(local·test). dev/prod는 GRAFANA_OTLP_ENABLED=true로 켠다.
# GRAFANA_OTLP_ENDPOINT는 게이트웨이 주소(.../otlp)까지만, 신호별 경로는 여기서 붙인다.
# GRAFANA_OTLP_AUTH_HEADER는 헤더 값 전체: "Basic base64(instanceId:token)".
management:
  metrics:
    distribution:
      # 응답 시간 p50/p95/p99를 계산할 히스토그램 구간 경계.
      # percentiles-histogram(기본 66구간)은 태그 조합마다 구간 수만큼 series가 생겨 Free 티어 한도(1만)를 넘는다.
      # 경계를 직접 정해 조합당 series를 줄인다. 경계를 바꾸면 변경 전후에 걸친 백분위가 틀어지므로 자주 바꾸지 않는다.
      slo:
        "[http.server.requests]": 50ms,100ms,200ms,500ms,1s,2s,3s,5s,10s,30s
        # 키는 이름 앞부분으로 매칭돼 처리 중 요청 수(.active)에도 구간이 붙는다. 더 긴 키로 빈 값을 줘 뺀다.
        "[http.server.requests.active]": ""
        # 외부 호출(Gemini 등) 응답 시간. 분석은 수 초 걸려 서버 요청보다 긴 구간을 촘촘히 둔다.
        # 소수점 표기(1.5s)는 바인딩되지 않아 ms로 쓴다.
        "[http.client.requests]": 250ms,500ms,1s,1500ms,2s,2500ms,3s,4s,5s,6s,7s,8s,10s,12s,15s,20s,25s,30s
        "[http.client.requests.active]": ""
    enable:
      # 트랜잭션 관측은 span으로만 본다(이름별 집계는 Tempo의 TraceQL로). 메트릭만 막히고 span은 그대로 남는다.
      "[nyummy.transaction]": false
  otlp:
    metrics:
      export:
        enabled: ${GRAFANA_OTLP_ENABLED:false}
        url: ${GRAFANA_OTLP_ENDPOINT:}/v1/metrics
        headers:
          Authorization: ${GRAFANA_OTLP_AUTH_HEADER:}
  tracing:
    export:
      otlp:
        enabled: ${GRAFANA_OTLP_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${GRAFANA_OTLP_ENABLED:false}
  opentelemetry:
    resource-attributes:
      # 같은 환경에 인스턴스가 여럿이면(prod ECS task 2개) 메트릭 series를 가르는 값.
      # 컨테이너 hostname: compose는 컨테이너 ID, ECS awsvpc는 task ENI 기준.
      "[service.instance.id]": ${HOSTNAME:local}
    tracing:
      export:
        otlp:
          endpoint: ${GRAFANA_OTLP_ENDPOINT:}/v1/traces
          headers:
            Authorization: ${GRAFANA_OTLP_AUTH_HEADER:}
    logging:
      export:
        otlp:
          endpoint: ${GRAFANA_OTLP_ENDPOINT:}/v1/logs
          headers:
            Authorization: ${GRAFANA_OTLP_AUTH_HEADER:}

# JDBC 관측(datasource-micrometer): 커넥션·쿼리·결과 읽기 span과 jdbc.* 메트릭을 만든다.
jdbc:
  datasource-proxy:
    # bind 값(이메일 등 개인정보)은 span에 넣지 않는다. SQL 문장은 ? 자리표시자 형태로만 들어간다.
    # 기본값도 false지만, 개인정보 때문에 끈 것이라 명시해 둔다.
    include-parameter-values: false

app:
  internal:
    batch-key: ${NYUMMY_BATCH_SECRET}
  admin:
    # 어드민 서비스에서만 true. 앱 서비스는 false라 어드민 빈을 만들지 않고 ADMIN_* 환경변수도 필요 없다.
    enabled: ${ADMIN_ENABLED:false}
    google-client-id: ${ADMIN_GOOGLE_CLIENT_ID:}
    cdn-distribution-id: ${CDN_DISTRIBUTION_ID:}
  fcm:
    # Firebase를 띄울지. false면 FirebaseMessaging 빈 없이 StubPushClient가 주입된다.
    enabled: true
    credentials-base64: ${FCM_CREDENTIALS_BASE64}
    # true면 FCM까지 왕복해 검증만 받고 기기에 배달하지 않는다.
    dry-run: false
  image:
    upload-method: "PUT"
    upload-url-time-to-live-minutes: 10
    image-url-time-to-live-minutes: 10
  room:
    # 가입할 때 장착한 채로 지급하는 기본 아이템. itemId는 items·room_items에 직접 넣은 행이다.
    # 값을 바꾸면 새로 가입하는 사용자부터 적용되고, 이미 지급한 아이템은 그대로다.
    default-room-items:
      # 줄무늬 원목 방(배경). 배경은 항상 원점·원본 크기·맨 뒤다.
      - item-id: 1
        x: 0.0
        y: 0.0
        z-index: 0
        scale: 1.0
      # 호박 쿠션(침대)
      - item-id: 2
        x: 27.0
        y: 22.0
        z-index: 2
        scale: 0.8
      # 스크래처 타워(기타)
      - item-id: 3
        x: 76.0
        y: 24.0
        z-index: 1
        scale: 1.0
  meal:
    max-daily-count: 10
    # 영양 분석 평가 요청을 띄울 식사 비율(%). 0이면 아무에게도 안 뜨고, 100이면 모든 식사에 뜬다.
    analysis-feedback-rate: 100
    intake-tolerance: 0.2
    min-positive-macro-count: 2
    # 식사 1회 보상 상자. 등급을 rate(%)로 뽑고, 그 등급의 코인 범위(양 끝 포함)에서 코인 수를 고르게 뽑는다.
    # 세 등급이 모두 있어야 하고 rate 합은 100이어야 한다. 아니면 앱이 뜨지 않는다(MealProperties).
    reward-boxes:
      bronze:
        rate: 50
        min-coin-quantity: 1
        max-coin-quantity: 5
      silver:
        rate: 30
        min-coin-quantity: 5
        max-coin-quantity: 10
      gold:
        rate: 20
        min-coin-quantity: 10
        max-coin-quantity: 15
    reward-mail-time-to-live: 7d
  cat:
    weight-update-interval-days: 3
    weight-update-tolerance: 0.2
  ai:
    api-key: ${GEMINI_API_KEY}
    model: "gemini-3.6-flash"
    base-url: "https://aiplatform.googleapis.com"
    connect-timeout: 5s
    read-timeout: 30s
    # task당 Gemini 동시 호출 상한. 실사용 100 TPS(식사 기록 6.33건/s, 한 task 60%) × Stub 지연 p95 약 10.4초 ≈ 40 + 여유
    max-connections: ${AI_MAX_CONNECTIONS:50}
    # 풀이 찼을 때 연결을 기다리는 최대 시간. 넘으면 대기열에 쌓지 않고 바로 실패한다(분석 FAILED).
    # 식사 기록 p95 기준 15초 − Gemini p95 약 10.4초 ≈ 4.6초 안으로 둔다. 길면 기다려 성공해도 기준을 넘고, + read-timeout 30초는 ALB 60초보다 짧아야 한다
    connection-request-timeout: ${AI_CONNECTION_REQUEST_TIMEOUT:3s}
  app-link:
    base-url: "https://link.nyummy.co.kr"
    home-url: "/home"
    signup-url: "/signup"
    meal-detail-url: "/meals"
    onboarding-url: "/onboarding"
    inquiry-detail-url: "/inquiries"

  email:
    client: ${EMAIL_CLIENT:smtp} # smtp | ses (ses는 샌드박스 해제 후 전환)
    from-address: ${EMAIL_FROM_ADDRESS}
    from-name: "Nyummy"
  oauth:
    kakao:
      issuer: "https://kauth.kakao.com"
      jwk-set-uri: "https://kauth.kakao.com/.well-known/jwks.json"
      app-key: ${KAKAO_NATIVE_APP_KEY}
      connect-timeout: 5s
      read-timeout: 5s
    google:
      issuers:
        - "https://accounts.google.com"
        - "accounts.google.com"
      jwk-set-uri: "https://www.googleapis.com/oauth2/v3/certs"
      client-ids:
        - ${GOOGLE_SERVER_CLIENT_ID}
      connect-timeout: 5s
      read-timeout: 5s
    naver:
      user-info-uri: "https://openapi.naver.com/v1/nid/me"
      connect-timeout: 5s
      read-timeout: 5s
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    encryption-key: ${JWT_ENCRYPTION_KEY}
    access-time-to-live: 30m
    refresh-time-to-live: 15d
    refresh-absolute-time-to-live: 90d
    email-challenge-time-to-live: 5m
    verified-time-to-live: 30m
    admin-time-to-live: 8h
  argon2:
    salt-length: 16
    hash-length: 32
    parallelism: 1
    memory: 19456
    iterations: 2