spring:
  application:
    name: nyummy
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/mysql

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  devtools:
    restart:
      additional-exclude: "db/migration/**"

app:
  meal:
    upload-method: "PUT"
    max-file-size-bytes: 10485760
    presigned-url-expiration-minutes: 10
  ai:
    api-key: ${GEMINI_API_KEY}
    model: "gemini-3.6-flash"
    base-url: "https://generativelanguage.googleapis.com"
    connect-timeout: 5s
    read-timeout: 30s
  auth:
    login-redirect-url: "dandi://home"
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-time-to-live: 30m
    refresh-time-to-live: 15d
  argon2:
    salt-length: 16
    hash-length: 32
    parallelism: 1
    memory: 19456
    iterations: 2