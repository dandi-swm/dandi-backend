# 영어 번역. 키와 인자 설명은 messages.properties를 본다.
# 인자가 있는 문구에서 작은따옴표는 ''로 쓴다(didn''t). 한 번만 쓰면 그 뒤 인자가 그대로 찍힌다.

# Meal labels — MealTime enum. Lowercase because they go mid-sentence ("Did you have lunch, Butler?").
mealTime.BREAKFAST=breakfast
mealTime.LUNCH=lunch
mealTime.DINNER=dinner

# Meal reminder — title {0}=Meal label(mealTime.*), body {0}=Cat name
push.mealReminder.title=Did you have {0}, Butler? 🐾
push.mealReminder.body={0} is so hungry, meow! Please snap a quick photo!

# Retention — Picked by days unfed. title {0}=Cat name
# Day 14
push.retention.sleep.title={0} is fast asleep 💤
push.retention.sleep.body=Log a meal to wake me up!
# Days 3, 6, 9, 12 — body {0}=Days unfed
push.retention.loseWeight.title={0} is getting thinner 🐾
push.retention.loseWeight.body=Haven''t eaten for {0} days, meow...
# Other days
push.retention.daily.title=Please feed {0}, meow 🐾
push.retention.daily.body=Did you forget to log a meal today, meow?

# My room item categories — RoomItemCategory enum. Shown on shop cards and my room tabs
roomItemCategory.BACKGROUND=Background
roomItemCategory.BED=Bed
roomItemCategory.CAT_WHEEL=Cat wheel
roomItemCategory.RUG=Rug
roomItemCategory.ETC=Accessory

# Shop card tags — Only one, in order: Limited > Sale > New
shop.tag.limited=Limited
shop.tag.discounted=Sale
shop.tag.new=New

# Recommend tab section headers
shop.section.dailyPromotion.title=Today's deals
shop.section.popular.title=Popular furniture now
shop.section.seeAll=See all

# Today's deals time left — {0}=hours, {1}=minutes
# Abbreviated (h, m) so one sentence fits both 1 and many. Plural forms would need MessageFormat choice.
shop.dailyPromotion.remainingHoursMinutes={0}h {1}m left
shop.dailyPromotion.remainingHours={0}h left
shop.dailyPromotion.remainingMinutes={0}m left
shop.dailyPromotion.changesInHours=Changes in {0}h

# Cart unavailable reasons — Shown under items that can't be purchased
cart.unavailableReason.productNotForSale=No longer on sale
cart.unavailableReason.alreadyOwned=You already own this room background
cart.unavailableReason.purchaseLimitExceeded=Purchase limit reached

# Cat body shapes — CatWeight enum
catWeight.LEAN=Skinny kitty
catWeight.SLIM=Slim kitty
catWeight.NORMAL=Normal kitty
catWeight.CHUBBY=Chubby kitty
catWeight.PLUMP=Chonky kitty

# Coin history titles — CoinHistoryCategory enum
coinHistoryCategory.MAIL_CLAIM=Mail claimed
coinHistoryCategory.ROOM_ITEM_PURCHASE=Shop purchase
coinHistoryCategory.IN_APP_PURCHASE=Coin purchase
coinHistoryCategory.COIN_GIFT=Coin gift
coinHistoryCategory.ITEM_PURCHASE_REFUND=Shop refund
coinHistoryCategory.REPORT_PURCHASE=Report purchase
coinHistoryCategory.REPORT_PURCHASE_REFUND=Report refund
# Shop purchase — {0}=First product name, {1}=Number of other products
coinHistory.itemPurchase.single=Bought {0}
coinHistory.itemPurchase.multiple=Bought {0} and {1} more
