spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB}?sslMode=VERIFY_IDENTITY&useUnicode=true&characterEncoding=UTF-8
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      max-lifetime: 1200000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: true
      timeout: 1s
      connect-timeout: 1s

  flyway:
    enabled: true
    # prod는 V0.34까지 수동 SQL로 적용했고 이력 테이블이 없다.
    # 이력 테이블이 없을 때만 V0.34를 기준으로 기록하고(baseline), 이후 버전(V0.35~)부터 Flyway가 적용한다.
    # 이력 테이블이 생긴 뒤에는 이 두 설정이 동작하지 않는다.
    baseline-on-migrate: true
    baseline-version: "0.34"

  jpa:
    show-sql: false

  web:
    error:
      include-stacktrace: never
      include-message: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.dandi.nyummy: INFO

management:
  opentelemetry:
    resource-attributes:
      "[deployment.environment.name]": prod
  tracing:
    sampling:
      # 요청의 10%만 trace를 남긴다(부하 환경 application-loadtest.yml과 같은 비율).
      # 요청이 들어올 때 미리 고르는 방식이라 느리거나 실패한 요청도 90%는 trace가 없다.
      # 그런 요청은 로그(traceId)와 메트릭으로 찾고, 모두 남겨야 하면 수집기의 tail sampling을 검토한다.
      probability: 0.1
